name: Upstream release sync

# Keeps `development` identical to desktop/desktop and, when upstream publishes a new
# release-X.Y.Z tag, opens a PR merging it into `linux`. It never resolves conflicts
# and never merges: CI (Linux port) runs on the PR and merging is left to a maintainer.
#
# Needs the UPSTREAM_SYNC_TOKEN secret (see docs/linux/README.md): GITHUB_TOKEN cannot
# push commits that touch .github/workflows, and PRs it opens do not trigger CI.

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: upstream-sync

jobs:
  sync:
    name: Sync upstream
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
      UPSTREAM: https://github.com/desktop/desktop.git
    steps:
      - name: Check token
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::The UPSTREAM_SYNC_TOKEN secret is not set (see docs/linux/README.md)."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: linux
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN }}

      # Not a force push: if `development` ever has commits upstream doesn't, this fails
      # instead of discarding them.
      - name: Fast-forward development to upstream
        run: |
          git fetch --no-tags "$UPSTREAM" development
          git push origin FETCH_HEAD:refs/heads/development

      - name: Find the latest upstream release
        id: release
        run: |
          set -euo pipefail
          # Stable releases only: skips -beta/-test tags and this fork's -linux tags.
          tag=$(git ls-remote --tags --refs "$UPSTREAM" 'release-*' |
            sed 's|.*refs/tags/||' |
            grep -E '^release-[0-9]+\.[0-9]+\.[0-9]+$' |
            sort -V | tail -n 1)
          git fetch --no-tags "$UPSTREAM" "refs/tags/$tag:refs/tags/$tag"
          branch="upstream-sync/$tag"
          if git merge-base --is-ancestor "$tag" HEAD; then
            echo "linux already contains $tag."
          elif git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "$branch already exists; see its pull request."
          else
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "branch=$branch" >> "$GITHUB_OUTPUT"
          fi

      - name: Open pull request
        if: steps.release.outputs.tag
        env:
          TAG: ${{ steps.release.outputs.tag }}
          BRANCH: ${{ steps.release.outputs.branch }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$BRANCH"

          if git merge --no-ff --no-edit -m "Merge upstream $TAG into linux" "refs/tags/$TAG"; then
            title="Merge upstream $TAG into linux"
            body="Clean merge of upstream \`$TAG\` into \`linux\`. Merge this PR (with a merge commit) once CI (Linux port) passes."
          else
            # Leave the branch at the upstream tag: the PR then shows the conflicts and
            # someone resolves them by hand.
            conflicts=$(git diff --name-only --diff-filter=U | sed 's/^/- `/; s/$/`/')
            git merge --abort
            git reset --hard "refs/tags/$TAG"
            title="Merge upstream $TAG into linux (conflicts)"
            body=$(printf '%s\n' \
              "Merging upstream \`$TAG\` into \`linux\` conflicts in:" "" "$conflicts" "" \
              'Resolve locally; the push is a fast-forward of this branch, so CI then runs here:' "" \
              '```shell' \
              'git fetch origin' \
              'git switch -c resolve-upstream origin/linux' \
              "git merge origin/$BRANCH        # resolve, keep the Linux changes, then commit" \
              "git push origin HEAD:$BRANCH" \
              '```')
          fi

          git push origin "$BRANCH"
          gh pr create --base linux --head "$BRANCH" --title "$title" --body "$body"
